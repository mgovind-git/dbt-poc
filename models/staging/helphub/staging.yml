
version: 2

models:
  - name: stg_hh_accounts
    columns:
      - name: account_id
        data_tests:
          - not_null
          - unique

  - name: stg_hh_subscriptions
    columns:
      - name: subscription_id
        data_tests:
          - not_null
          - unique
      - name: account_id
        data_tests:
          - not_null
      - name: is_active
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: stg_hh_invoices
    columns:
      - name: invoice_id
        data_tests:
          - not_null
          - unique
      - name: account_id
        data_tests:
          - not_null

  - name: stg_hh_plans
    columns:
      - name: plan_id
        data_tests:
          - not_null
          - unique

  - name: stg_hh_ticket_events
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: account_id
        data_tests:
          - not_null
