
name: retail_dbt
version: "1.0.0"
config-version: 2

profile: retail_dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  Gender_Value: "F"

models:
  retail_dbt:
    bronze:
      +materialized: table
      +schema: bronze
      +tags: ["bronze"]

    silver:
      +materialized: table
      +schema: silver
      +tags: ["silver"]

    gold:
      +materialized: table
      +schema: gold
      +tags: ["gold"]

    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]

    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +tags: ["intermediate"]

    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

seeds:
  retail_dbt:
    +schema: seeds
    +tags: ["seed"]
